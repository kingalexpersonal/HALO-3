<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>halo</title>
<style>
  :root{
    color-scheme:light dark;
    --paper:#EDEAE4;
    --paper-raised:#FFFFFF;
    --ink:#221F1D;
    --ink-soft:#6B655F;
    --coral:#E8635A;
    --coral-dark:#C64C43;
    --line:#DAD5CC;
    --radius:22px;
    --font:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', system-ui, sans-serif;
    --glass-bg:rgba(255,255,255,0.35);
    --glass-bg-soft:rgba(255,255,255,0.22);
    --glass-border:rgba(255,255,255,0.55);
    --glass-highlight:inset 0 1px 0 rgba(255,255,255,0.65), inset 0 0 0 1px rgba(255,255,255,0.18);
    --focus:#0A84FF;
    --shadow-large:0 30px 70px rgba(0,0,0,.24), 0 0 0 1px rgba(255,255,255,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --paper:#1C1C1E;
      --paper-raised:#2C2C2E;
      --ink:#F2F2F2;
      --ink-soft:#9A9A9E;
      --line:#3A3A3C;
      --glass-bg:rgba(255,255,255,0.12);
      --glass-bg-soft:rgba(255,255,255,0.07);
      --glass-border:rgba(255,255,255,0.18);
      --glass-highlight:inset 0 1px 0 rgba(255,255,255,0.15), inset 0 0 0 1px rgba(255,255,255,0.08);
      --focus:#64D2FF;
      --shadow-large:0 30px 70px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08);
    }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    background:radial-gradient(circle at 20% 10%, #fffaf5 0, #f2eee7 42%, #ded8cf 100%);
    color:var(--ink);
    font-size:16px;
    overscroll-behavior:none;
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    overflow:hidden;
  }
  @media (prefers-color-scheme: dark){
    body{ background:radial-gradient(circle at 20% 10%, #343436 0, #1c1c1e 48%, #09090a 100%); }
  }

  /* ---------- Window chrome ---------- */
  .window{
    width:100%;
    height:100%;
    max-width:1280px;
    max-height:820px;
    display:flex;
    border-radius:12px;
    overflow:hidden;
    box-shadow:var(--shadow-large);
    isolation:isolate;
  }
  /* ---------- Sidebar ---------- */
  .sidebar{
    width:300px;
    min-width:300px;
    height:100vh;
    display:flex;
    flex-direction:column;
    border-right:1px solid var(--glass-border);
    background:var(--glass-bg-soft);
    backdrop-filter:blur(40px) saturate(180%);
    -webkit-backdrop-filter:blur(40px) saturate(180%);
    box-shadow:var(--glass-highlight);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    padding:22px 20px 16px;
  }
  .brand svg{ width:38px; height:38px; flex-shrink:0; }
  .brand h1{
    font-size:20px;
    margin:0;
    font-weight:700;
    letter-spacing:-0.02em;
  }
  .new-note{
    margin:4px 20px 14px;
    padding:11px 16px;
    background:rgba(232,99,90,0.75);
    color:#fff;
    border:1px solid rgba(255,255,255,0.4);
    border-radius:999px;
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.5);
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:transform 180ms cubic-bezier(.2,.8,.2,1), background 180ms ease, box-shadow 180ms ease;
    min-height:44px;
  }
  .new-note:hover{ background:rgba(198,76,67,0.9); box-shadow:0 8px 18px rgba(198,76,67,.22), inset 0 1px 0 rgba(255,255,255,.5); }
  .new-note:active{ transform:scale(.97); transition-duration:80ms; }

  .search-field{
    margin:0 20px 12px;
    padding:8px 14px;
    background:var(--glass-bg-soft);
    border:1px solid var(--glass-border);
    border-radius:999px;
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    font-family:inherit;
    font-size:13px;
    color:var(--ink);
    outline:none;
    min-height:40px;
    transition:background 180ms ease, box-shadow 180ms ease;
  }
  .search-field:focus{ background:var(--glass-bg); box-shadow:0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
  .search-field::placeholder{ color:var(--ink-soft); }

  .note-list{
    flex:1;
    overflow-y:auto;
    padding:0 12px 12px;
  }
  .note-item{
    position:relative;
    padding:12px 34px 12px 12px;
    margin-bottom:6px;
    border-radius:14px;
    cursor:pointer;
    border:1px solid transparent;
  }
  .pin-btn{
    position:absolute;
    top:10px;
    right:8px;
    border:none;
    background:none;
    font-size:13px;
    cursor:pointer;
    opacity:0;
    padding:2px 4px;
  }
  .note-item:hover .pin-btn, .note-item .pin-btn.pinned{ opacity:1; }
  .note-item:hover{ background:var(--glass-bg-soft); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); }
  .note-item:active{ transform:scale(.985); transition-duration:80ms; }
  .note-item.active{
    background:var(--glass-bg);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-color:var(--glass-border);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .note-item .title{
    font-weight:600;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .note-item .preview{
    font-size:12.5px;
    color:var(--ink-soft);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-top:2px;
  }
  .note-item .date{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .empty-list{
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    padding:30px 20px;
    line-height:1.5;
  }

  /* ---------- Main editor ---------- */
  .main{
    flex:1;
    height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--glass-bg-soft);
    backdrop-filter:blur(40px) saturate(180%);
    -webkit-backdrop-filter:blur(40px) saturate(180%);
  }
  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 34px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(24px) saturate(180%);
    -webkit-backdrop-filter:blur(24px) saturate(180%);
    border-bottom:1px solid var(--glass-border);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.3);
  }
  .toolbar .date-label{
    font-size:13px;
    color:var(--ink-soft);
  }
  .delete-btn{
    border:none;
    background:none;
    color:var(--ink-soft);
    font-family:inherit;
    font-size:13px;
    cursor:pointer;
    padding:6px 12px;
    border-radius:999px;
  }
  .delete-btn:hover{ color:var(--coral-dark); background:var(--glass-bg); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); }

  .editor-wrap{
    flex:1;
    overflow-y:auto;
    padding:10px 34px 40px;
  }
  #note-title{
    width:100%;
    border:none;
    outline:none;
    font-family:var(--font);
    font-size:clamp(2rem, 4vw, 2.8rem);
    line-height:1.08;
    font-weight:700;
    letter-spacing:-0.035em;
    font-optical-sizing:auto;
    margin-top:14px;
    background:transparent;
    color:var(--ink);
  }
  #note-title::placeholder{ color:#C9C3BA; }
  #note-body{
    width:100%;
    min-height:60vh;
    border:none;
    outline:none;
    resize:none;
    font-family:var(--font);
    font-size:1rem;
    line-height:1.7;
    letter-spacing:.005em;
    background:transparent;
    color:var(--ink);
    margin-top:10px;
  }
  #note-body::placeholder{ color:#C9C3BA; }

  .empty-state{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    color:var(--ink-soft);
  }
  .empty-state svg{ width:110px; height:110px; }
  .empty-state p{ font-size:14px; margin:0; }

  /* ---------- Pomodoro ---------- */
  .pomodoro-card{ margin:0 20px 14px; padding:13px 14px; border:1px solid var(--glass-border); border-radius:16px; background:var(--glass-bg-soft); backdrop-filter:blur(20px) saturate(160%); -webkit-backdrop-filter:blur(20px) saturate(160%); }
  .pomodoro-heading{ display:flex; align-items:center; justify-content:space-between; color:var(--ink-soft); font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
  .pomodoro-heading span:first-child{ display:inline-flex; align-items:center; gap:6px; }
  .pomodoro-settings-btn{ border:none; background:none; color:var(--ink-soft); cursor:pointer; font-size:14px; padding:2px 4px; }
  .pomodoro-settings-btn:hover{ color:var(--ink); }
  .pomodoro-time-row{ display:flex; align-items:end; justify-content:space-between; margin-top:7px; }
  .pomodoro-time{ color:var(--ink); font-size:28px; font-weight:750; letter-spacing:-.06em; line-height:1; }
  .pomodoro-count{ color:var(--ink-soft); font-size:10px; }
  .pomodoro-phase{ margin-top:5px; overflow:hidden; color:var(--ink-soft); font-size:11px; text-overflow:ellipsis; white-space:nowrap; }
  .pomodoro-actions{ display:flex; gap:6px; margin-top:10px; }
  .pomodoro-btn{ min-height:29px; padding:0 10px; border:1px solid var(--glass-border); border-radius:999px; color:var(--ink); background:var(--glass-bg); font-family:inherit; font-size:11px; cursor:pointer; }
  .pomodoro-btn.primary{ color:#fff; background:var(--ink); }
  .pomodoro-btn:hover{ background:var(--paper-raised); }
  .pomodoro-btn.primary:hover{ background:#444; }
  .pomodoro-link{ display:block; max-width:100%; margin-top:8px; padding:0; overflow:hidden; border:none; color:var(--coral-dark); background:none; font:inherit; font-size:10px; text-align:left; text-overflow:ellipsis; white-space:nowrap; cursor:pointer; }
  .pomodoro-settings{ display:none; gap:7px; margin-top:10px; padding-top:10px; border-top:1px solid var(--glass-border); }
  .pomodoro-settings.open{ display:grid; }
  .pomodoro-settings label{ display:flex; align-items:center; justify-content:space-between; color:var(--ink-soft); font-size:11px; }
  .pomodoro-settings input{ width:50px; padding:4px 5px; border:1px solid var(--glass-border); border-radius:7px; color:var(--ink); background:var(--glass-bg); font:inherit; font-size:11px; text-align:right; }
  .pomodoro-settings .pomodoro-btn{ justify-self:start; min-height:26px; }

  /* scrollbars */
  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:rgba(0,0,0,.18); border-radius:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  ::selection{ background:var(--focus); color:#fff; }
  :where(button, input, textarea, [tabindex]):focus-visible{ outline:3px solid color-mix(in srgb, var(--focus) 72%, transparent); outline-offset:3px; }
  .sr-only{ position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
  @media (prefers-reduced-transparency: reduce){ .sidebar, .main, .toolbar, .palette, .new-note, .search-field, .note-item.active{ backdrop-filter:none; -webkit-backdrop-filter:none; background:var(--paper-raised); } }
  @media (prefers-contrast: more){ .sidebar, .main, .toolbar, .palette, .note-item.active{ border-color:var(--ink-soft); } }
  @media (prefers-reduced-motion: reduce){ *, *::before, *::after{ scroll-behavior:auto !important; transition-duration:.01ms !important; animation-duration:.01ms !important; animation-iteration-count:1 !important; } #splash-screen{ transition:opacity 160ms ease; } }

  .menu-btn{
    display:none;
    border:1px solid var(--glass-border);
    background:var(--glass-bg);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-radius:999px;
    font-family:inherit;
    font-size:16px;
    cursor:pointer;
    color:var(--ink);
    width:34px;
    height:34px;
  }
  .sidebar-overlay{
    display:none;
  }

  .palette-overlay{
    display:none;
    position:fixed;
    inset:0;
    z-index:10;
    background:rgba(0,0,0,.25);
    align-items:flex-start;
    justify-content:center;
    padding-top:12vh;
  }
  .palette-overlay.open{ display:flex; animation:palette-in 220ms cubic-bezier(.2,.8,.2,1) both; }
  @keyframes palette-in{ from{ opacity:0; } to{ opacity:1; } }
  .palette{
    width:480px;
    max-width:90vw;
    max-height:60vh;
    display:flex;
    flex-direction:column;
    background:var(--paper-raised);
    background:var(--glass-bg);
    backdrop-filter:blur(40px) saturate(180%);
    -webkit-backdrop-filter:blur(40px) saturate(180%);
    border:1px solid var(--glass-border);
    border-radius:16px;
    box-shadow:0 20px 50px rgba(0,0,0,.35), var(--glass-highlight);
    overflow:hidden;
  }
  .palette-input{
    border:none;
    outline:none;
    background:transparent;
    padding:16px 18px;
    font-family:inherit;
    font-size:16px;
    color:var(--ink);
    border-bottom:1px solid var(--glass-border);
  }
  .palette-results{
    overflow-y:auto;
    padding:8px;
  }
  .palette-item{
    padding:10px 12px;
    border-radius:10px;
    font-size:14px;
    cursor:pointer;
  }
  .palette-item:hover, .palette-item.selected{ background:var(--glass-bg-soft); }

  @media (max-width:720px){
    .window{ border-radius:0; max-width:none; max-height:none; box-shadow:none; }
    .sidebar{ position:fixed; z-index:5; transform:translateX(-100%); transition:transform .2s ease; box-shadow:0 0 30px rgba(0,0,0,.15); }
    .sidebar.open{ transform:translateX(0); }
    .sidebar.dragging{ transition:none; }
    .toolbar{ padding:16px 20px; }
    .editor-wrap{ padding:0 20px 30px; }
    .menu-btn{
      display:inline-block;
      position:fixed;
      top:14px;
      left:14px;
      z-index:6;
      box-shadow:0 2px 8px rgba(0,0,0,.18);
    }
    .sidebar-overlay.open{
      display:block;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.28);
      z-index:4;
      backdrop-filter:blur(3px);
      -webkit-backdrop-filter:blur(3px);
    }
  }

  /* ---------- Splash screen ---------- */
  #splash-screen{
    position:fixed;
    inset:0;
    z-index:100;
    background:#0B0B0B;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    opacity:1;
    transition:opacity .4s ease;
  }
  #splash-screen.hidden{
    opacity:0;
    pointer-events:none;
  }
  #splash-screen .wordmark{
    font-family:var(--font);
    font-weight:800;
    font-size:16vw;
    letter-spacing:-0.04em;
    color:#F5F1E8;
    line-height:1;
  }
  #splash-screen svg{ width:16vw; height:16vw; flex-shrink:0; }
  @media (min-width:720px){
    #splash-screen .wordmark{ font-size:110px; }
    #splash-screen svg{ width:110px; height:110px; }
  }
</style>
</head>
<body>

<div id="splash-screen">
  <span class="wordmark">hal</span>
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <path fill="#E8635A" d="M27 12 C46 4, 70 6, 84 20 C96 32, 97 56, 89 72 C80 90, 56 97, 36 92 C16 87, 4 68, 5 47 C6 29, 12 18, 27 12 Z"/>
    <ellipse cx="38" cy="52" rx="7.5" ry="11" fill="#1B1917" transform="rotate(-8 38 52)"/>
    <ellipse cx="60" cy="49" rx="9.5" ry="13" fill="#1B1917" transform="rotate(-4 60 49)"/>
  </svg>
</div>

<div class="window">
<div class="sidebar" id="sidebar" aria-label="Notes navigation">
  <div class="brand">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <path fill="#E8635A" d="M27 12 C46 4, 70 6, 84 20 C96 32, 97 56, 89 72 C80 90, 56 97, 36 92 C16 87, 4 68, 5 47 C6 29, 12 18, 27 12 Z"/>
      <ellipse cx="38" cy="52" rx="7.5" ry="11" fill="#1B1917" transform="rotate(-8 38 52)"/>
      <ellipse cx="60" cy="49" rx="9.5" ry="13" fill="#1B1917" transform="rotate(-4 60 49)"/>
    </svg>
    <h1>halo</h1>
  </div>
  <button class="new-note" id="new-note-btn">+ New note</button>
  <label class="sr-only" for="search-field">Search notes</label>
  <input class="search-field" id="search-field" type="search" placeholder="Search notes" autocomplete="off">
  <section class="pomodoro-card" aria-label="pomodoro timer">
    <div class="pomodoro-heading"><span>◷ pomodoro</span><button class="pomodoro-settings-btn" id="pomodoro-settings-btn" aria-label="open pomodoro settings">⚙</button></div>
    <div class="pomodoro-time-row"><strong class="pomodoro-time" id="pomodoro-time">25:00</strong><span class="pomodoro-count" id="pomodoro-count">0 sessions</span></div>
    <div class="pomodoro-phase" id="pomodoro-phase">focus · no note linked</div>
    <div class="pomodoro-actions"><button class="pomodoro-btn primary" id="pomodoro-toggle">start</button><button class="pomodoro-btn" id="pomodoro-reset">reset</button></div>
    <button class="pomodoro-link" id="pomodoro-link" type="button">link current note</button>
    <form class="pomodoro-settings" id="pomodoro-settings"><label>focus <span><input id="pomodoro-focus" type="number" min="1" max="120" value="25"> min</span></label><label>break <span><input id="pomodoro-break" type="number" min="1" max="60" value="5"> min</span></label><button class="pomodoro-btn primary" type="submit">save settings</button></form>
  </section>
  <div class="note-list" id="note-list"></div>
  <button class="delete-btn" id="export-all-btn" style="margin:4px 20px 14px; align-self:flex-start;">Export all</button>
</div>
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<div class="palette-overlay" id="palette-overlay" role="dialog" aria-modal="true" aria-label="Quick switcher">
  <div class="palette">
    <label class="sr-only" for="palette-input">Jump to a note</label>
    <input class="palette-input" id="palette-input" placeholder="Jump to a note, or press Enter for a new one" autocomplete="off">
    <div class="palette-results" id="palette-results"></div>
  </div>
</div>

<div class="main">
  <button class="menu-btn" id="menu-btn" aria-label="Toggle note list" aria-expanded="false">☰</button>
  <div class="toolbar" id="toolbar" style="display:none;">
    <span class="date-label" id="date-label"></span>
    <span>
      <button class="delete-btn" id="export-btn">Export</button>
      <button class="delete-btn" id="delete-btn">Delete</button>
    </span>
  </div>
  <div class="editor-wrap" id="editor-wrap" style="display:none;">
    <input id="note-title" placeholder="Untitled" autocomplete="off">
    <textarea id="note-body" placeholder="Start writing…"></textarea>
  </div>

  <div class="empty-state" id="empty-state">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <path fill="#E8635A" d="M27 12 C46 4, 70 6, 84 20 C96 32, 97 56, 89 72 C80 90, 56 97, 36 92 C16 87, 4 68, 5 47 C6 29, 12 18, 27 12 Z"/>
      <ellipse cx="38" cy="52" rx="7.5" ry="11" fill="#1B1917" transform="rotate(-8 38 52)"/>
      <ellipse cx="60" cy="49" rx="9.5" ry="13" fill="#1B1917" transform="rotate(-4 60 49)"/>
    </svg>
    <p>No note selected. Pick one, or start a new one.</p>
  </div>
</div>
</div>

<script>
  const STORAGE_KEY = 'halo-notes';
  let notes;
  try { notes = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]'); } catch { notes = []; }
  let activeId = null;

  const listEl = document.getElementById('note-list');
  const titleEl = document.getElementById('note-title');
  const bodyEl = document.getElementById('note-body');
  const toolbarEl = document.getElementById('toolbar');
  const editorWrapEl = document.getElementById('editor-wrap');
  const emptyStateEl = document.getElementById('empty-state');
  const dateLabelEl = document.getElementById('date-label');
  const searchEl = document.getElementById('search-field');

  // Device-local Pomodoro state. The storage event mirrors it across open HALO tabs.
  const POMODORO_KEY = 'halo-pomodoro-v1';
  const defaultPomodoro = { phase:'focus', seconds:1500, running:false, sessions:0, linkedNoteId:null, focusMinutes:25, breakMinutes:5 };
  let pomodoro = loadPomodoro();
  let pomodoroInterval = null;
  const pomodoroTimeEl = document.getElementById('pomodoro-time');
  const pomodoroPhaseEl = document.getElementById('pomodoro-phase');
  const pomodoroCountEl = document.getElementById('pomodoro-count');
  const pomodoroToggleEl = document.getElementById('pomodoro-toggle');
  const pomodoroLinkEl = document.getElementById('pomodoro-link');
  const pomodoroSettingsEl = document.getElementById('pomodoro-settings');
  const pomodoroFocusEl = document.getElementById('pomodoro-focus');
  const pomodoroBreakEl = document.getElementById('pomodoro-break');

  function clampMinutes(value, max, fallback){
    const number = Number(value);
    return Number.isFinite(number) ? Math.min(max, Math.max(1, Math.round(number))) : fallback;
  }
  function secondsFor(phase){ return (phase === 'focus' ? pomodoro.focusMinutes : pomodoro.breakMinutes) * 60; }
  function loadPomodoro(){
    try{
      const saved = JSON.parse(localStorage.getItem(POMODORO_KEY) || 'null');
      if(!saved) return {...defaultPomodoro};
      const focusMinutes = clampMinutes(saved.focusMinutes, 120, 25);
      const breakMinutes = clampMinutes(saved.breakMinutes, 60, 5);
      const phase = saved.phase === 'break' ? 'break' : 'focus';
      return { phase, seconds:Math.max(0, Number(saved.seconds) || (phase === 'focus' ? focusMinutes : breakMinutes) * 60), running:Boolean(saved.running), sessions:Math.max(0, Number(saved.sessions) || 0), linkedNoteId:typeof saved.linkedNoteId === 'string' ? saved.linkedNoteId : null, focusMinutes, breakMinutes };
    }catch{ return {...defaultPomodoro}; }
  }
  function savePomodoro(){ localStorage.setItem(POMODORO_KEY, JSON.stringify(pomodoro)); }
  function formatPomodoro(seconds){ const safe = Math.max(0, Math.floor(seconds)); return `${String(Math.floor(safe/60)).padStart(2,'0')}:${String(safe%60).padStart(2,'0')}`; }
  function linkedPomodoroNote(){ return notes.find(note => note.id === pomodoro.linkedNoteId); }
  function renderPomodoro(){
    const linked = linkedPomodoroNote();
    pomodoroTimeEl.textContent = formatPomodoro(pomodoro.seconds);
    pomodoroPhaseEl.textContent = `${pomodoro.phase} · ${linked ? (linked.title.trim() || 'Untitled') : 'no note linked'}`;
    pomodoroCountEl.textContent = `${pomodoro.sessions} ${pomodoro.sessions === 1 ? 'session' : 'sessions'}`;
    pomodoroToggleEl.textContent = pomodoro.running ? 'pause' : 'start';
    pomodoroLinkEl.textContent = activeId && linked?.id === activeId ? `linked to ${linked.title.trim() || 'Untitled'}` : activeId ? `link current note` : 'select a note to link';
    pomodoroLinkEl.disabled = !activeId;
    pomodoroFocusEl.value = pomodoro.focusMinutes;
    pomodoroBreakEl.value = pomodoro.breakMinutes;
  }
  function notifyPomodoro(phase){
    const title = phase === 'focus' ? 'focus session complete' : 'break complete';
    const body = phase === 'focus' ? 'take a short break.' : 'ready for another focused session?';
    if(typeof showToast === 'function') showToast(`${title} — ${body}`);
    if(typeof Notification !== 'undefined' && Notification.permission === 'granted') new Notification(title, {body});
    try{
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if(!AudioContextClass) return;
      const context = new AudioContextClass(); const oscillator = context.createOscillator(); const gain = context.createGain();
      oscillator.frequency.value = 660; gain.gain.setValueAtTime(.0001, context.currentTime); gain.gain.exponentialRampToValueAtTime(.05, context.currentTime + .02); gain.gain.exponentialRampToValueAtTime(.0001, context.currentTime + .22); oscillator.connect(gain).connect(context.destination); oscillator.start(); oscillator.stop(context.currentTime + .23);
    }catch{}
  }
  async function startPomodoro(){
    if(typeof Notification !== 'undefined' && Notification.permission === 'default'){ try{ await Notification.requestPermission(); }catch{} }
    pomodoro.running = true; pomodoro.linkedNoteId = pomodoro.linkedNoteId || activeId; savePomodoro(); renderPomodoro();
  }
  function pausePomodoro(){ pomodoro.running = false; savePomodoro(); renderPomodoro(); }
  function togglePomodoro(){ pomodoro.running ? pausePomodoro() : startPomodoro(); }
  function resetPomodoro(){ pomodoro.running = false; pomodoro.phase = 'focus'; pomodoro.seconds = pomodoro.focusMinutes * 60; savePomodoro(); renderPomodoro(); }
  function tickPomodoro(){
    if(!pomodoro.running) return;
    if(pomodoro.seconds > 1){ pomodoro.seconds -= 1; savePomodoro(); renderPomodoro(); return; }
    const completedPhase = pomodoro.phase; pomodoro.phase = completedPhase === 'focus' ? 'break' : 'focus'; pomodoro.seconds = secondsFor(pomodoro.phase); pomodoro.running = false; if(completedPhase === 'focus') pomodoro.sessions += 1; savePomodoro(); renderPomodoro(); notifyPomodoro(completedPhase);
  }
  document.getElementById('pomodoro-toggle').addEventListener('click', togglePomodoro);
  document.getElementById('pomodoro-reset').addEventListener('click', resetPomodoro);
  document.getElementById('pomodoro-settings-btn').addEventListener('click', () => pomodoroSettingsEl.classList.toggle('open'));
  pomodoroSettingsEl.addEventListener('submit', (event) => { event.preventDefault(); pomodoro.focusMinutes = clampMinutes(pomodoroFocusEl.value, 120, 25); pomodoro.breakMinutes = clampMinutes(pomodoroBreakEl.value, 60, 5); pomodoro.running = false; pomodoro.seconds = secondsFor(pomodoro.phase); savePomodoro(); renderPomodoro(); pomodoroSettingsEl.classList.remove('open'); });
  pomodoroLinkEl.addEventListener('click', () => { if(!activeId) return; pomodoro.linkedNoteId = activeId; savePomodoro(); renderPomodoro(); });
  window.setInterval(tickPomodoro, 1000);
  window.addEventListener('storage', (event) => { if(event.key === POMODORO_KEY && event.newValue){ pomodoro = loadPomodoro(); renderPomodoro(); } });


  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
  }

  function formatDate(ts){
    return new Date(ts).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit' });
  }

  function renderList(){
    listEl.innerHTML = '';
    const query = searchEl.value.trim().toLowerCase();
    const filtered = query
      ? notes.filter(n => n.title.toLowerCase().includes(query) || n.body.toLowerCase().includes(query))
      : notes;
    if(notes.length === 0){
      listEl.innerHTML = '<div class="empty-list">No notes yet — tap "New note" to start.</div>';
      return;
    }
    if(filtered.length === 0){
      listEl.innerHTML = '<div class="empty-list">No notes match your search.</div>';
      return;
    }
    const sorted = [...filtered].sort((a,b) => {
      if(!!a.pinned !== !!b.pinned) return (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0);
      return b.updatedAt - a.updatedAt;
    });
    sorted.forEach(note => {
      const item = document.createElement('div');
      item.className = 'note-item' + (note.id === activeId ? ' active' : '');
      item.innerHTML = `
        <button class="pin-btn${note.pinned ? ' pinned' : ''}" data-id="${note.id}" aria-label="${note.pinned ? 'Unpin' : 'Pin'} note" aria-pressed="${!!note.pinned}">${note.pinned ? '📌' : '📍'}</button>
        <div class="title">${escapeHtml(note.title) || 'Untitled'}</div>
        <div class="preview">${escapeHtml(note.body.slice(0, 60)) || 'No additional text'}</div>
        <div class="date">${formatDate(note.updatedAt)}</div>
      `;
      item.addEventListener('click', () => { selectNote(note.id); toggleSidebar(false); });
      item.querySelector('.pin-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        togglePin(note.id);
      });
      listEl.appendChild(item);
    });
  }

  function togglePin(id){
    const note = notes.find(n => n.id === id);
    if(!note) return;
    note.pinned = !note.pinned;
    save();
    renderList();
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function cleanupIfEmpty(id){
    if(!id) return;
    const note = notes.find(n => n.id === id);
    if(note && !note.title.trim() && !note.body.trim()){
      notes = notes.filter(n => n.id !== id);
      save();
    }
  }

  function selectNote(id){
    if(activeId && activeId !== id) cleanupIfEmpty(activeId);
    activeId = id;
    const note = notes.find(n => n.id === id);
    if(!note) return showEmptyState();
    titleEl.value = note.title;
    bodyEl.value = note.body;
    dateLabelEl.textContent = 'Edited ' + formatDate(note.updatedAt);
    toolbarEl.style.display = 'flex';
    editorWrapEl.style.display = 'block';
    emptyStateEl.style.display = 'none';
    renderList();
    renderPomodoro();
  }

  function showEmptyState(){
    activeId = null;
    toolbarEl.style.display = 'none';
    editorWrapEl.style.display = 'none';
    emptyStateEl.style.display = 'flex';
    renderList();
  }

  function newNote(){
    cleanupIfEmpty(activeId);
    const note = {
      id: crypto.randomUUID(),
      title: '',
      body: '',
      pinned: false,
      updatedAt: Date.now()
    };
    notes.push(note);
    save();
    selectNote(note.id);
    titleEl.focus();
  }

  let saveIndicatorTimeout;
  function updateActiveNote(){
    const note = notes.find(n => n.id === activeId);
    if(!note) return;
    note.title = titleEl.value;
    note.body = bodyEl.value;
    note.updatedAt = Date.now();
    save();
    dateLabelEl.textContent = 'Saved';
    clearTimeout(saveIndicatorTimeout);
    saveIndicatorTimeout = setTimeout(() => {
      dateLabelEl.textContent = 'Edited ' + formatDate(note.updatedAt);
    }, 1200);
    renderList();
  }

  function deleteActiveNote(){
    if(!activeId) return;
    const deletedId = activeId;
    notes = notes.filter(n => n.id !== deletedId);
    save();
    showEmptyState();
    if(pomodoro.linkedNoteId === deletedId){ pomodoro.linkedNoteId = null; savePomodoro(); renderPomodoro(); }
  }

  function downloadBlob(content, filename, type){
    const blob = new Blob([content], { type });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  }

  function exportActiveNote(){
    const note = notes.find(n => n.id === activeId);
    if(!note) return;
    const filename = (note.title.trim() || 'Untitled').replace(/[^a-z0-9-_ ]/gi, '').trim() || 'Untitled';
    downloadBlob(`# ${note.title}\n\n${note.body}`, `${filename}.md`, 'text/markdown');
  }

  function exportAllNotes(){
    downloadBlob(JSON.stringify(notes, null, 2), 'halo-notes-export.json', 'application/json');
  }

  const sidebarEl = document.getElementById('sidebar');
  const overlayEl = document.getElementById('sidebar-overlay');
  const menuBtn = document.getElementById('menu-btn');

  function toggleSidebar(open){
    sidebarEl.classList.toggle('open', open);
    overlayEl.classList.toggle('open', open);
    menuBtn.setAttribute('aria-expanded', String(open));
  }
  menuBtn.addEventListener('click', () => toggleSidebar(!sidebarEl.classList.contains('open')));
  overlayEl.addEventListener('click', () => toggleSidebar(false));

  let drawerGesture = null;
  sidebarEl.addEventListener('pointerdown', (event) => {
    if (window.innerWidth > 720 || event.pointerType === 'mouse') return;
    drawerGesture = { startX:event.clientX, lastX:event.clientX, lastTime:performance.now(), velocity:0, startOffset:sidebarEl.classList.contains('open') ? 0 : -sidebarEl.offsetWidth };
    sidebarEl.classList.add('dragging');
    sidebarEl.setPointerCapture(event.pointerId);
  });
  sidebarEl.addEventListener('pointermove', (event) => {
    if (!drawerGesture) return;
    const now = performance.now();
    const dt = Math.max(1, now - drawerGesture.lastTime);
    drawerGesture.velocity = (event.clientX - drawerGesture.lastX) / dt;
    drawerGesture.lastX = event.clientX; drawerGesture.lastTime = now;
    const raw = drawerGesture.startOffset + event.clientX - drawerGesture.startX;
    const min = -sidebarEl.offsetWidth;
    const bounded = raw > 0 ? raw * .22 : raw < min ? min + (raw - min) * .22 : raw;
    sidebarEl.style.transform = `translate3d(${bounded}px,0,0)`;
  });
  sidebarEl.addEventListener('pointerup', (event) => {
    if (!drawerGesture) return;
    const distance = event.clientX - drawerGesture.startX;
    const projected = drawerGesture.startOffset + distance + drawerGesture.velocity * 180;
    const shouldOpen = projected > -sidebarEl.offsetWidth / 2;
    drawerGesture = null; sidebarEl.classList.remove('dragging'); sidebarEl.style.transform = '';
    toggleSidebar(shouldOpen);
  });
  sidebarEl.addEventListener('pointercancel', () => {
    drawerGesture = null; sidebarEl.classList.remove('dragging'); sidebarEl.style.transform = '';
    toggleSidebar(false);
  });

  document.getElementById('new-note-btn').addEventListener('click', newNote);
  document.getElementById('delete-btn').addEventListener('click', deleteActiveNote);
  document.getElementById('export-btn').addEventListener('click', exportActiveNote);
  document.getElementById('export-all-btn').addEventListener('click', exportAllNotes);
  titleEl.addEventListener('input', updateActiveNote);
  bodyEl.addEventListener('input', updateActiveNote);
  searchEl.addEventListener('input', renderList);
  window.addEventListener('beforeunload', () => cleanupIfEmpty(activeId));

  const paletteOverlay = document.getElementById('palette-overlay');
  const paletteInput = document.getElementById('palette-input');
  const paletteResults = document.getElementById('palette-results');

  function openPalette(){
    paletteOverlay.classList.add('open');
    paletteInput.value = '';
    renderPaletteResults();
    paletteInput.focus();
  }
  function closePalette(){
    paletteOverlay.classList.remove('open');
  }
  function renderPaletteResults(){
    const q = paletteInput.value.trim().toLowerCase();
    const matches = q
      ? notes.filter(n => n.title.toLowerCase().includes(q) || n.body.toLowerCase().includes(q))
      : notes;
    const sorted = [...matches].sort((a,b) => b.updatedAt - a.updatedAt);
    paletteResults.innerHTML = '';
    const newItem = document.createElement('div');
    newItem.className = 'palette-item';
    newItem.textContent = '+ New note';
    newItem.addEventListener('click', () => { closePalette(); newNote(); });
    paletteResults.appendChild(newItem);
    sorted.forEach(note => {
      const item = document.createElement('div');
      item.className = 'palette-item';
      item.textContent = note.title.trim() || 'Untitled';
      item.addEventListener('click', () => { closePalette(); selectNote(note.id); });
      paletteResults.appendChild(item);
    });
  }
  paletteInput.addEventListener('input', renderPaletteResults);
  paletteOverlay.addEventListener('click', (e) => { if(e.target === paletteOverlay) closePalette(); });

  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape' && paletteOverlay.classList.contains('open')){
      closePalette();
      return;
    }
    if(!e.metaKey) return;
    const tag = document.activeElement.tagName;
    if(e.key.toLowerCase() === 'k'){
      e.preventDefault();
      paletteOverlay.classList.contains('open') ? closePalette() : openPalette();
      return;
    }
    if(e.key.toLowerCase() === 'n'){
      e.preventDefault();
      newNote();
    }
    if((e.key === 'Backspace' || e.key === 'Delete') && tag !== 'INPUT' && tag !== 'TEXTAREA' && activeId){
      e.preventDefault();
      deleteActiveNote();
    }
  });

  renderList();
  showEmptyState();
  renderPomodoro();

  const splashEl = document.getElementById('splash-screen');
  setTimeout(() => {
    splashEl.classList.add('hidden');
    setTimeout(() => splashEl.remove(), 400);
  }, 700);
</script>

</body>
