<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HALO</title>
<style>
  :root{
    --paper:#EDEAE4;
    --paper-raised:#FFFFFF;
    --ink:#221F1D;
    --ink-soft:#6B655F;
    --coral:#E8635A;
    --coral-dark:#C64C43;
    --line:#DAD5CC;
    --radius:22px;
    --font:-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Display', system-ui, sans-serif;
    --glass-bg:rgba(255,255,255,0.35);
    --glass-bg-soft:rgba(255,255,255,0.22);
    --glass-border:rgba(255,255,255,0.55);
    --glass-highlight:inset 0 1px 0 rgba(255,255,255,0.65), inset 0 0 0 1px rgba(255,255,255,0.18);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:var(--font);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    background:#FFFFFF;
    color:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
    height:100vh;
    overflow:hidden;
  }

  /* ---------- Window chrome ---------- */
  .window{
    width:100%;
    height:100%;
    max-width:1280px;
    max-height:820px;
    display:flex;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 30px 60px rgba(0,0,0,.45), 0 0 0 1px rgba(255,255,255,.06);
  }
  .traffic-lights{
    display:flex;
    gap:8px;
    padding:14px 16px 4px;
  }
  .traffic-lights span{
    width:12px;
    height:12px;
    border-radius:50%;
    display:inline-block;
  }
  .traffic-lights .red{ background:#FF5F57; }
  .traffic-lights .yellow{ background:#FEBC2E; }
  .traffic-lights .green{ background:#28C840; }

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:300px;
    min-width:300px;
    height:100vh;
    display:flex;
    flex-direction:column;
    border-right:1px solid var(--glass-border);
    background:var(--glass-bg-soft);
    backdrop-filter:blur(40px) saturate(180%);
    -webkit-backdrop-filter:blur(40px) saturate(180%);
    box-shadow:var(--glass-highlight);
  }
  .brand{
    display:flex;
    align-items:center;
    gap:12px;
    padding:6px 20px 16px;
  }
  .brand svg{ width:38px; height:38px; flex-shrink:0; }
  .brand h1{
    font-size:20px;
    margin:0;
    font-weight:700;
    letter-spacing:-0.02em;
  }
  .new-note{
    margin:4px 20px 14px;
    padding:11px 16px;
    background:rgba(232,99,90,0.75);
    color:#fff;
    border:1px solid rgba(255,255,255,0.4);
    border-radius:999px;
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.5);
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    transition:transform .12s ease, background .12s ease;
  }
  .new-note:hover{ background:rgba(198,76,67,0.85); }
  .new-note:active{ transform:scale(0.97); }

  .note-list{
    flex:1;
    overflow-y:auto;
    padding:0 12px 12px;
  }
  .note-item{
    padding:12px 12px;
    margin-bottom:6px;
    border-radius:14px;
    cursor:pointer;
    border:1px solid transparent;
  }
  .note-item:hover{ background:var(--glass-bg-soft); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); }
  .note-item.active{
    background:var(--glass-bg);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border-color:var(--glass-border);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .note-item .title{
    font-weight:600;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .note-item .preview{
    font-size:12.5px;
    color:var(--ink-soft);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    margin-top:2px;
  }
  .note-item .date{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:4px;
  }
  .empty-list{
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    padding:30px 20px;
    line-height:1.5;
  }

  /* ---------- Main editor ---------- */
  .main{
    flex:1;
    height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--glass-bg-soft);
    backdrop-filter:blur(40px) saturate(180%);
    -webkit-backdrop-filter:blur(40px) saturate(180%);
  }
  .toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 34px;
    border-bottom:1px solid var(--glass-border);
  }
  .toolbar .date-label{
    font-size:13px;
    color:var(--ink-soft);
  }
  .delete-btn{
    border:none;
    background:none;
    color:var(--ink-soft);
    font-family:inherit;
    font-size:13px;
    cursor:pointer;
    padding:6px 12px;
    border-radius:999px;
  }
  .delete-btn:hover{ color:var(--coral-dark); background:var(--glass-bg); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); }

  .editor-wrap{
    flex:1;
    overflow-y:auto;
    padding:10px 34px 40px;
  }
  #note-title{
    width:100%;
    border:none;
    outline:none;
    font-family:var(--font);
    font-size:32px;
    font-weight:700;
    letter-spacing:-0.01em;
    margin-top:14px;
    background:transparent;
    color:var(--ink);
  }
  #note-title::placeholder{ color:#C9C3BA; }
  #note-body{
    width:100%;
    min-height:60vh;
    border:none;
    outline:none;
    resize:none;
    font-family:var(--font);
    font-size:16px;
    line-height:1.7;
    background:transparent;
    color:var(--ink);
    margin-top:10px;
  }
  #note-body::placeholder{ color:#C9C3BA; }

  .empty-state{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:16px;
    color:var(--ink-soft);
  }
  .empty-state svg{ width:110px; height:110px; }
  .empty-state p{ font-size:14px; margin:0; }

  /* scrollbars */
  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:rgba(0,0,0,.18); border-radius:10px; }
  ::-webkit-scrollbar-track{ background:transparent; }

  ::selection{ background:#0A84FF; color:#fff; }
  button:focus-visible{ outline:2px solid #0A84FF; outline-offset:2px; }

  .menu-btn{
    display:none;
    border:1px solid var(--glass-border);
    background:var(--glass-bg);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    border-radius:999px;
    font-family:inherit;
    font-size:16px;
    cursor:pointer;
    color:var(--ink);
    width:34px;
    height:34px;
  }
  .sidebar-overlay{
    display:none;
  }

  @media (max-width:720px){
    .window{ border-radius:0; max-width:none; max-height:none; box-shadow:none; }
    .sidebar{ position:fixed; z-index:5; transform:translateX(-100%); transition:transform .2s ease; box-shadow:0 0 30px rgba(0,0,0,.15); }
    .sidebar.open{ transform:translateX(0); }
    .toolbar{ padding:16px 20px; }
    .editor-wrap{ padding:0 20px 30px; }
    .menu-btn{
      display:inline-block;
      position:fixed;
      top:14px;
      left:14px;
      z-index:6;
      box-shadow:0 2px 8px rgba(0,0,0,.18);
    }
    .sidebar-overlay.open{
      display:block;
      position:fixed;
      inset:0;
      background:rgba(0,0,0,.25);
      z-index:4;
    }
  }
</style>
</head>
<body>

<div class="window">
<div class="sidebar" id="sidebar">
  <div class="traffic-lights"><span class="red"></span><span class="yellow"></span><span class="green"></span></div>
  <div class="brand">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <path fill="#E8635A" d="M27 12 C46 4, 70 6, 84 20 C96 32, 97 56, 89 72 C80 90, 56 97, 36 92 C16 87, 4 68, 5 47 C6 29, 12 18, 27 12 Z"/>
      <ellipse cx="38" cy="52" rx="7.5" ry="11" fill="#1B1917" transform="rotate(-8 38 52)"/>
      <ellipse cx="60" cy="49" rx="9.5" ry="13" fill="#1B1917" transform="rotate(-4 60 49)"/>
    </svg>
    <h1>HALO</h1>
  </div>
  <button class="new-note" id="new-note-btn">+ New note</button>
  <div class="note-list" id="note-list"></div>
</div>
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<div class="main">
  <button class="menu-btn" id="menu-btn" aria-label="Toggle note list">☰</button>
  <div class="toolbar" id="toolbar" style="display:none;">
    <span class="date-label" id="date-label"></span>
    <button class="delete-btn" id="delete-btn">Delete</button>
  </div>
  <div class="editor-wrap" id="editor-wrap" style="display:none;">
    <input id="note-title" placeholder="Untitled" autocomplete="off">
    <textarea id="note-body" placeholder="Start writing…"></textarea>
  </div>

  <div class="empty-state" id="empty-state">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <path fill="#E8635A" d="M27 12 C46 4, 70 6, 84 20 C96 32, 97 56, 89 72 C80 90, 56 97, 36 92 C16 87, 4 68, 5 47 C6 29, 12 18, 27 12 Z"/>
      <ellipse cx="38" cy="52" rx="7.5" ry="11" fill="#1B1917" transform="rotate(-8 38 52)"/>
      <ellipse cx="60" cy="49" rx="9.5" ry="13" fill="#1B1917" transform="rotate(-4 60 49)"/>
    </svg>
    <p>No note selected. Pick one, or start a new one.</p>
  </div>
</div>
</div>

<script>
  const STORAGE_KEY = 'halo-notes';
  let notes = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  let activeId = null;

  const listEl = document.getElementById('note-list');
  const titleEl = document.getElementById('note-title');
  const bodyEl = document.getElementById('note-body');
  const toolbarEl = document.getElementById('toolbar');
  const editorWrapEl = document.getElementById('editor-wrap');
  const emptyStateEl = document.getElementById('empty-state');
  const dateLabelEl = document.getElementById('date-label');

  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
  }

  function formatDate(ts){
    return new Date(ts).toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric', hour:'2-digit', minute:'2-digit' });
  }

  function renderList(){
    listEl.innerHTML = '';
    if(notes.length === 0){
      listEl.innerHTML = '<div class="empty-list">No notes yet — tap "New note" to start.</div>';
      return;
    }
    const sorted = [...notes].sort((a,b) => b.updatedAt - a.updatedAt);
    sorted.forEach(note => {
      const item = document.createElement('div');
      item.className = 'note-item' + (note.id === activeId ? ' active' : '');
      item.innerHTML = `
        <div class="title">${escapeHtml(note.title) || 'Untitled'}</div>
        <div class="preview">${escapeHtml(note.body.slice(0, 60)) || 'No additional text'}</div>
        <div class="date">${formatDate(note.updatedAt)}</div>
      `;
      item.addEventListener('click', () => { selectNote(note.id); toggleSidebar(false); });
      listEl.appendChild(item);
    });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function selectNote(id){
    activeId = id;
    const note = notes.find(n => n.id === id);
    if(!note) return showEmptyState();
    titleEl.value = note.title;
    bodyEl.value = note.body;
    dateLabelEl.textContent = 'Edited ' + formatDate(note.updatedAt);
    toolbarEl.style.display = 'flex';
    editorWrapEl.style.display = 'block';
    emptyStateEl.style.display = 'none';
    renderList();
  }

  function showEmptyState(){
    activeId = null;
    toolbarEl.style.display = 'none';
    editorWrapEl.style.display = 'none';
    emptyStateEl.style.display = 'flex';
    renderList();
  }

  function newNote(){
    const note = {
      id: crypto.randomUUID(),
      title: '',
      body: '',
      updatedAt: Date.now()
    };
    notes.push(note);
    save();
    selectNote(note.id);
    titleEl.focus();
  }

  function updateActiveNote(){
    const note = notes.find(n => n.id === activeId);
    if(!note) return;
    note.title = titleEl.value;
    note.body = bodyEl.value;
    note.updatedAt = Date.now();
    save();
    dateLabelEl.textContent = 'Edited ' + formatDate(note.updatedAt);
    renderList();
  }

  function deleteActiveNote(){
    notes = notes.filter(n => n.id !== activeId);
    save();
    showEmptyState();
  }

  const sidebarEl = document.getElementById('sidebar');
  const overlayEl = document.getElementById('sidebar-overlay');
  const menuBtn = document.getElementById('menu-btn');

  function toggleSidebar(open){
    sidebarEl.classList.toggle('open', open);
    overlayEl.classList.toggle('open', open);
  }
  menuBtn.addEventListener('click', () => toggleSidebar(!sidebarEl.classList.contains('open')));
  overlayEl.addEventListener('click', () => toggleSidebar(false));

  document.getElementById('new-note-btn').addEventListener('click', newNote);
  document.getElementById('delete-btn').addEventListener('click', deleteActiveNote);
  titleEl.addEventListener('input', updateActiveNote);
  bodyEl.addEventListener('input', updateActiveNote);

  document.addEventListener('keydown', (e) => {
    if(!e.metaKey) return;
    const tag = document.activeElement.tagName;
    if(e.key.toLowerCase() === 'n'){
      e.preventDefault();
      newNote();
    }
    if((e.key === 'Backspace' || e.key === 'Delete') && tag !== 'INPUT' && tag !== 'TEXTAREA' && activeId){
      e.preventDefault();
      deleteActiveNote();
    }
  });

  renderList();
  showEmptyState();
</script>

</body>
</html>
